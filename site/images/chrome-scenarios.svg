<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-label="Bảy tình huống khi so installs với uninstalls">
  <defs><marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1F2A44"/></marker></defs>
  <rect width="960" height="450" rx="28" fill="#FAF6EE"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#1F2A44">
    <g transform="translate(30 40)"><rect x="5" y="5" width="210" height="150" rx="20" fill="#1F2A44"/><rect width="210" height="150" rx="20" fill="#8FB59A" stroke="#1F2A44" stroke-width="3"/><text x="105.0" y="62" text-anchor="middle" font-size="17" font-weight="700" font-family="Georgia, 'Times New Roman', serif">1 · Tăng trưởng thật</text><text x="105.0" y="83" text-anchor="middle" font-size="15" font-weight="700">Installs ↑</text><text x="105.0" y="103" text-anchor="middle" font-size="15">Uninstalls ↔ ↓</text></g>
    <g transform="translate(260 40)"><rect x="5" y="5" width="210" height="150" rx="20" fill="#1F2A44"/><rect width="210" height="150" rx="20" fill="#F08A5D" stroke="#1F2A44" stroke-width="3"/><text x="105.0" y="62" text-anchor="middle" font-size="17" font-weight="700" font-family="Georgia, 'Times New Roman', serif">2 · Xô thủng</text><text x="105.0" y="83" text-anchor="middle" font-size="15" font-weight="700">Installs ↑</text><text x="105.0" y="103" text-anchor="middle" font-size="15">Uninstalls ↑↑</text></g>
    <g transform="translate(490 40)"><rect x="5" y="5" width="210" height="150" rx="20" fill="#1F2A44"/><rect width="210" height="150" rx="20" fill="#7EC8E3" stroke="#1F2A44" stroke-width="3"/><text x="105.0" y="62" text-anchor="middle" font-size="17" font-weight="700" font-family="Georgia, 'Times New Roman', serif">3 · Tốt, thiếu khách</text><text x="105.0" y="83" text-anchor="middle" font-size="15" font-weight="700">Installs ↓</text><text x="105.0" y="103" text-anchor="middle" font-size="15">Uninstalls thấp</text></g>
    <g transform="translate(720 40)"><rect x="5" y="5" width="210" height="150" rx="20" fill="#1F2A44"/><rect width="210" height="150" rx="20" fill="#C8643F" stroke="#1F2A44" stroke-width="3"/><text x="105.0" y="62" text-anchor="middle" font-size="17" font-weight="700" font-family="Georgia, 'Times New Roman', serif">4 · Báo động</text><text x="105.0" y="83" text-anchor="middle" font-size="15" font-weight="700">Installs ↓</text><text x="105.0" y="103" text-anchor="middle" font-size="15">Uninstalls ↑</text></g>
    <g transform="translate(145 230)"><rect x="5" y="5" width="210" height="150" rx="20" fill="#1F2A44"/><rect width="210" height="150" rx="20" fill="#F5C451" stroke="#1F2A44" stroke-width="3"/><text x="105.0" y="62" text-anchor="middle" font-size="17" font-weight="700" font-family="Georgia, 'Times New Roman', serif">5 · Update lỗi</text><text x="105.0" y="83" text-anchor="middle" font-size="15" font-weight="700">Installs ↔</text><text x="105.0" y="103" text-anchor="middle" font-size="15">Uninstalls vọt sau update</text></g>
    <g transform="translate(375 230)"><rect x="5" y="5" width="210" height="150" rx="20" fill="#1F2A44"/><rect width="210" height="150" rx="20" fill="#F5C451" stroke="#1F2A44" stroke-width="3"/><text x="105.0" y="62" text-anchor="middle" font-size="17" font-weight="700" font-family="Georgia, 'Times New Roman', serif">6 · Traffic sai người</text><text x="105.0" y="83" text-anchor="middle" font-size="15" font-weight="700">Installs vọt 1 ngày</text><text x="105.0" y="103" text-anchor="middle" font-size="15">Uninstalls vọt 1–3 ngày sau</text></g>
    <g transform="translate(605 230)"><rect width="210" height="150" rx="20" fill="#FAF6EE" stroke="#1F2A44" stroke-width="3" stroke-dasharray="8 6"/><text x="105.0" y="62" text-anchor="middle" font-size="17" font-weight="700" font-family="Georgia, 'Times New Roman', serif">7 · Đứng yên</text><text x="105.0" y="83" text-anchor="middle" font-size="15" font-weight="700">Installs ≈</text><text x="105.0" y="103" text-anchor="middle" font-size="15">Uninstalls ≈</text></g>
    <text x="480" y="425" text-anchor="middle" font-size="16" fill="#C8643F" font-weight="700">Tìm mình ở thẻ nào, rồi làm đúng việc của thẻ đó.</text>
