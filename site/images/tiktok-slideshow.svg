<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="A TikTok slideshow: six slides, hook first, app name on slide five">
  <rect width="960" height="460" rx="28" fill="#FAF6EE"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#1F2A44">
    <!-- phone -->
    <g transform="translate(60 40)">
      <rect x="8" y="8" width="210" height="380" rx="34" fill="#1F2A44"/>
      <rect width="210" height="380" rx="34" fill="#1F2A44" stroke="#1F2A44" stroke-width="3"/>
      <rect x="12" y="14" width="186" height="352" rx="24" fill="#F08A5D"/>
      <rect x="12" y="14" width="186" height="34" rx="12" fill="#1F2A44" opacity=".25"/>
      <rect x="12" y="300" width="186" height="66" rx="0" fill="#1F2A44" opacity=".25"/>
      <rect x="30" y="98" width="150" height="20" rx="6" fill="#FAF6EE"/>
      <rect x="44" y="124" width="122" height="20" rx="6" fill="#FAF6EE"/>
      <rect x="54" y="150" width="102" height="20" rx="6" fill="#FAF6EE"/>
      <text x="105" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#FAF6EE">SLIDE 1 · HOOK</text>
      <circle cx="176" cy="220" r="10" fill="#FAF6EE"/><circle cx="176" cy="250" r="10" fill="#FAF6EE"/><circle cx="176" cy="280" r="10" fill="#FAF6EE"/>
      <g fill="#FAF6EE"><circle cx="85" cy="350" r="3"/><circle cx="97" cy="350" r="3" opacity=".5"/><circle cx="109" cy="350" r="3" opacity=".5"/><circle cx="121" cy="350" r="3" opacity=".5"/></g>
      <text x="105" y="196" text-anchor="middle" font-size="11" fill="#FAF6EE">top 10% clear</text>
      <text x="105" y="292" text-anchor="middle" font-size="11" fill="#FAF6EE">bottom 20% clear</text>
    </g>
    <!-- swipe arrow -->
    <path d="M300 230 h46" stroke="#1F2A44" stroke-width="5" stroke-linecap="round"/><path d="M340 216 l16 14 -16 14" fill="none" stroke="#1F2A44" stroke-width="5" stroke-linecap="round"/>
    <text x="323" y="210" text-anchor="middle" font-size="14" font-weight="700">swipe</text>
    <!-- six slides -->
    <g font-size="14">
      <g transform="translate(380 70)"><rect x="5" y="5" width="160" height="150" rx="14" fill="#1F2A44"/><rect width="160" height="150" rx="14" fill="#F08A5D" stroke="#1F2A44" stroke-width="3"/><text x="14" y="28" font-weight="700" fill="#FAF6EE">1 · HOOK</text><text x="14" y="60" fill="#FAF6EE">"My landlord said</text><text x="14" y="80" fill="#FAF6EE">I can't change</text><text x="14" y="100" fill="#FAF6EE">anything…"</text></g>
      <g transform="translate(570 70)"><rect x="5" y="5" width="160" height="150" rx="14" fill="#1F2A44"/><rect width="160" height="150" rx="14" fill="#FAF6EE" stroke="#1F2A44" stroke-width="3"/><text x="14" y="28" font-weight="700">2 · PROBLEM</text><rect x="14" y="48" width="132" height="80" rx="8" fill="#E9E1D3"/><text x="80" y="94" text-anchor="middle">plain room</text></g>
      <g transform="translate(760 70)"><rect x="5" y="5" width="160" height="150" rx="14" fill="#1F2A44"/><rect width="160" height="150" rx="14" fill="#FAF6EE" stroke="#1F2A44" stroke-width="3"/><text x="14" y="28" font-weight="700">3 · REVEAL</text><rect x="14" y="48" width="132" height="80" rx="8" fill="#8FB59A"/><text x="80" y="94" text-anchor="middle">style A</text></g>
      <g transform="translate(380 245)"><rect x="5" y="5" width="160" height="150" rx="14" fill="#1F2A44"/><rect width="160" height="150" rx="14" fill="#FAF6EE" stroke="#1F2A44" stroke-width="3"/><text x="14" y="28" font-weight="700">4 · REACTION</text><rect x="14" y="48" width="132" height="80" rx="8" fill="#7EC8E3"/><text x="80" y="94" text-anchor="middle">"she picked this"</text></g>
      <g transform="translate(570 245)"><rect x="5" y="5" width="160" height="150" rx="14" fill="#1F2A44"/><rect width="160" height="150" rx="14" fill="#F5C451" stroke="#1F2A44" stroke-width="3"/><text x="14" y="28" font-weight="700">5 · CTA</text><text x="14" y="66" font-size="17" font-weight="700">Made with</text><text x="14" y="88" font-size="17" font-weight="700">YourApp ★</text><text x="14" y="118">link in bio</text></g>
      <g transform="translate(760 245)"><rect x="5" y="5" width="160" height="150" rx="14" fill="#1F2A44"/><rect width="160" height="150" rx="14" fill="#FAF6EE" stroke="#1F2A44" stroke-width="3"/><text x="14" y="28" font-weight="700">6 · FOLLOW</text><text x="14" y="76">Follow for</text><text x="14" y="96">more rooms</text></g>
    </g>
    <text x="380" y="438" font-size="15" fill="#C8643F" font-weight="700">Same scene on every slide · only the style changes · app name on slide 5</text>
  </g>
</svg>
