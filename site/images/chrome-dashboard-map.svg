    <g transform="translate(680 60)"><rect x="5" y="5" width="240" height="120" rx="20" fill="#1F2A44"/><rect width="240" height="120" rx="20" fill="#F5C451" stroke="#1F2A44" stroke-width="3"/><text x="120.0" y="49" text-anchor="middle" font-size="24" font-weight="700" font-family="Georgia, 'Times New Roman', serif">Ai ở lại?</text><text x="120.0" y="74" text-anchor="middle" font-size="17" font-weight="700">Weekly users</text><text x="120.0" y="94" text-anchor="middle" font-size="14">+ enabled vs disabled</text></g>
