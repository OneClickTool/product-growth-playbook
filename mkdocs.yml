site_name: Product Growth Playbook
site_description: Free AI growth skills for people building apps, extensions, games, plugins, templates and AI tools.
site_url: https://oneclicktool.github.io/product-growth-playbook/
repo_url: https://github.com/OneClickTool/product-growth-playbook
repo_name: OneClickTool/product-growth-playbook
edit_uri: edit/main/
# scripts/build_site.py copies the repo's Markdown here and writes _mkdocs.gen.yml (nav), which inherits this file.
# Build: python3 scripts/build_site.py && mkdocs build -f _mkdocs.gen.yml
docs_dir: .site-docs
site_dir: _site
use_directory_urls: true

theme:
  name: material
  custom_dir: site/overrides
  font:
    text: Figtree
    code: JetBrains Mono
  icon:
    logo: material/rocket-launch
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc: { permalink: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist: { custom_checkbox: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_css:
  - site/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/lightstarvn
      name: Tu Nguyen on X (@lightstarvn)
    - icon: fontawesome/brands/github
      link: https://github.com/tucarmd
      name: Tu Nguyen on GitHub (@tucarmd)
    - icon: fontawesome/solid/star
      link: https://github.com/OneClickTool/product-growth-playbook
      name: Star the playbook on GitHub

validation:
  links:
    not_found: info
    unrecognized_links: info
