site_name: Product Growth Playbook
site_description: Free AI growth skills for people building apps, extensions, games, plugins, templates and AI tools.
site_url: https://oneclicktool.github.io/product-growth-playbook/
repo_url: https://github.com/OneClickTool/product-growth-playbook
repo_name: OneClickTool/product-growth-playbook
edit_uri: edit/main/
# scripts/build_site.py copies the repo's Markdown here; the source of truth stays in the repo folders.
docs_dir: .site-docs
site_dir: _site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc: { permalink: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist: { custom_checkbox: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

validation:
  links:
    not_found: info
    unrecognized_links: info
